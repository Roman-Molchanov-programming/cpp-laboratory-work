name: SonarCloud Analysis

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Clang-Format Linter
        shell: powershell
        run: |
          $files = Get-ChildItem -Path . -Include *.cpp, *.h, *.hpp -Recurse | Where-Object { $_.FullName -notmatch '\\\.sonar\\' -and $_.FullName -notmatch '\\\.vs\\' }
          if ($files) {
            foreach ($file in $files) {
              Write-Host "Checking format for: $($file.FullName)"
              clang-format --dry-run --Werror $file.FullName
            }
          }

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Download Build Wrapper & SonarScanner
        shell: powershell
        run: |
          New-Item -Path .sonar -ItemType Directory -Force
          $headers = @{ "User-Agent" = "Mozilla/5.0" }
          
          $wrapperUrl = "https://sonarcloud.io/static/cpp/build-wrapper-win-x86.zip"
          Invoke-WebRequest -Uri $wrapperUrl -Headers $headers -OutFile .sonar\build-wrapper.zip
          Expand-Archive -Path .sonar\build-wrapper.zip -DestinationPath .sonar\build-wrapper -Force
          
          $scannerUrl = "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-windows.zip"
          Invoke-WebRequest -Uri $scannerUrl -Headers $headers -OutFile .sonar\sonar-scanner.zip
          Expand-Archive -Path .sonar\sonar-scanner.zip -DestinationPath .sonar\sonar-scanner -Force

      - name: Build project with Build Wrapper
        shell: powershell
        run: |
          $bwPath = Get-ChildItem -Path .sonar\build-wrapper -Filter "build-wrapper-win-x86-64.exe" -Recurse | Select-Object -ExpandProperty FullName
          
          # Ищем целевой файл проекта или решения внутри папки LR
          $target = Get-ChildItem -Path . -Include *.slnx, *.vcxproj -Recurse | Where-Object { $_.FullName -notmatch '\\\.sonar\\' -and $_.FullName -notmatch '\\\.vs\\' } | Select-Object -First 1
          
          if (-not $target) {
            Write-Error "No project or solution file found!"
            exit 1
          }

          Write-Host "=== Building: $($target.FullName) ==="
          & $bwPath --out-dir bw-output msbuild "$($target.FullName)" /t:Rebuild /p:Configuration=Release /p:Platform="x64"

      - name: Run SonarScanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $scannerJar = Get-ChildItem -Path .sonar\sonar-scanner -Filter "sonar-scanner-cli-*.jar" -Recurse | Select-Object -ExpandProperty FullName
          & "$env:JAVA_HOME_21_X64\bin\java.exe" -jar $scannerJar