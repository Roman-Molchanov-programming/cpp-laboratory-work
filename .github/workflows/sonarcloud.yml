name: SonarCloud Analysis

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Download Build Wrapper & SonarScanner with JRE
        shell: powershell
        run: |
          New-Item -Path .sonar -ItemType Directory -Force
          
          # Download Build Wrapper
          $wrapperUrl = "https://sonarcloud.io/static/cpp/build-wrapper-win-x86.zip"
          Invoke-WebRequest -Uri $wrapperUrl -OutFile .sonar\build-wrapper.zip
          Expand-Archive -Path .sonar\build-wrapper.zip -DestinationPath .sonar\build-wrapper -Force
          
          # Download SonarScanner CLI with embedded Java 21
          $scannerUrl = "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.1.0.3477-windows-x64.zip"
          Invoke-WebRequest -Uri $scannerUrl -OutFile .sonar\sonar-scanner.zip
          Expand-Archive -Path .sonar\sonar-scanner.zip -DestinationPath .sonar\sonar-scanner -Force

      - name: Build all projects with Build Wrapper
        shell: powershell
        run: |
          $bwPath = Get-ChildItem -Path .sonar\build-wrapper -Filter "build-wrapper-win-x86-64.exe" -Recurse | Select-Object -ExpandProperty FullName
          
          $targets = Get-ChildItem -Path . -Include *.vcxproj, *.sln, *.slnx -Recurse | Where-Object { $_.FullName -notmatch '\\\.sonar\\' -and $_.FullName -notmatch '\\\.vs\\' }
          
          if ($targets.Count -eq 0) {
            Write-Error "No project or solution files found!"
            exit 1
          }

          foreach ($target in $targets) {
            Write-Host "=== Building: $($target.FullName) ==="
            & $bwPath --out-dir bw-output msbuild "$($target.FullName)" /p:Configuration=Release /p:Platform="x64"
          }

      - name: Run SonarScanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $scannerPath = Get-ChildItem -Path .sonar\sonar-scanner -Filter "sonar-scanner.bat" -Recurse | Select-Object -ExpandProperty FullName
          & $scannerPath
